version: '3.9'

# MongoDB is hosted on Atlas — no local mongo container needed.
# Set MONGODB_URI in a root .env file before running docker-compose.

services:
  resume-parser:
    build: ./resume-parser
    container_name: interview_parser
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: interview_backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI}          # Atlas connection string from .env
      - RESUME_PARSER_URL=http://resume-parser:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - resume-parser
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: interview_frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    depends_on:
      - backend
    restart: unless-stopped
